<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Schedule Plan</title>

    <!-- ติดตั้งเป็นแอปบนเครื่อง (Edge / Chrome → ติดตั้งแอปนี้) · ไอคอนแท็บ -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2e8b57">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!--
        กรอบขนาดคงที่ — หน้ากระดานเหมือนกันทุกเครื่อง / ทุกขนาดจอ

        ตัวโปรแกรม (app.html) ทำงานในหน้าต่างเสมือน 2557 × 1403 เสมอ (ขนาดหน้าเว็บเต็มจอของเครื่องหลัก — จอ 2560×1440 · 150%)
        → ความสูงหมวด ความกว้างช่องวัน ขนาดตัวอักษร ตำแหน่งทุกชิ้น คำนวณเท่ากันทุกเครื่อง
        แล้วกรอบนี้ย่อ / ขยายทั้งก้อนให้เต็มความกว้างจอจริง (สูงต่างกันนิดหน่อย → ปรับแนวตั้งให้พอดี · ต่างมาก → เลื่อนลงดูได้)
    -->
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: hidden;
            background: #f4f6f5;
        }

        /* จอเตี้ยกว่ากระดานมาก → เลื่อนขึ้นลงดูส่วนล่างได้ */
        html.zg-scroll,
        html.zg-scroll body {
            overflow-y: auto;
        }

        #zgSpacer {
            width: 1px;
            height: 0;
        }

        #zgStage {
            position: absolute;
            left: 0;
            top: 0;
            width: 2557px;
            height: 1403px;
            transform-origin: 0 0;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .06);
        }

        #zgApp {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
        }

        @media print {
            #zgStage { position: static; transform: none !important; }
        }
    </style>
</head>

<body>
    <div id="zgSpacer"></div>
    <div id="zgStage">
        <iframe id="zgApp" title="Property Schedule Plan" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    </div>

    <script>
        (function () {

            /* ต้องตรงกับขนาดกรอบใน CSS ด้านบน */
            const W = 2557;
            const H = 1403;

            /* ความสูงต่างจากกรอบไม่เกินเท่านี้ → บีบ/ยืดแนวตั้งนิดเดียวให้เต็มจอพอดี (มองไม่ออก) */
            const FILL_TOLERANCE = 0.06;

            /* จอกว้างพิเศษ (21:9 เช่น 3440×1440) เท่านั้นที่ใช้ "พอดีความสูง วางกลาง" — จอ 16:9 / โน้ตบุ๊ก ทำงานเหมือนเดิม */
            const ULTRAWIDE = 2.2;

            const stage = document.getElementById("zgStage");
            const spacer = document.getElementById("zgSpacer");
            const frame = document.getElementById("zgApp");

            /* ลิงก์จาก CRM (?customer_id=…) / ลิงก์อื่น → ส่งต่อให้ตัวโปรแกรมครบ */
            frame.src = "app.html" + location.search + location.hash;

            /*
                เต็มความกว้างเสมอ (ไม่มีขอบซ้าย-ขวา)
                - สูงไม่พอ/เกินนิดหน่อย → ปรับแนวตั้งให้พอดีจอ
                - จอกว้างพิเศษ (กว้างกว่ากระดานมาก) → พอดีความสูง วางกลางจอ
                - สูงไม่พอมาก (จอแคบ) → คงสัดส่วน เลื่อนลงดูได้ · สูงเกินมาก → คงสัดส่วน เว้นด้านล่าง
            */
            function fit() {
                const root = document.documentElement;
                const vh = window.innerHeight;
                let vw = window.innerWidth;
                let sx = vw / W;
                let sy = sx;
                const need = H * sx;
                let left = 0;
                if (Math.abs(need - vh) / vh <= FILL_TOLERANCE) {
                    sy = vh / H;
                    root.classList.remove("zg-scroll");
                } else if (need > vh && vw / vh >= ULTRAWIDE) {
                    /* จอกว้างพิเศษ (เช่น 3440×1440) → พอดีความสูง วางกลางจอ เห็นทั้งกระดานไม่ต้องเลื่อน */
                    sx = sy = vh / H;
                    left = Math.round((vw - W * sx) / 2);
                    root.classList.remove("zg-scroll");
                } else if (need > vh) {
                    root.classList.add("zg-scroll");
                    vw = root.clientWidth || vw;          // มีแถบเลื่อน → กว้างลดลง
                    sx = sy = vw / W;
                } else {
                    root.classList.remove("zg-scroll");
                }
                sx = Math.max(0.1, sx);
                sy = Math.max(0.1, sy);
                stage.style.transform = `translate(${left}px, 0) scale(${sx}, ${sy})`;
                spacer.style.height = root.classList.contains("zg-scroll") ? `${Math.ceil(H * sy)}px` : "0px";
            }

            fit();
            window.addEventListener("resize", fit);

            function focusApp() {
                try { frame.contentWindow.focus(); } catch (error) { /* ไม่เป็นไร */ }
            }

            /* ชื่อแท็บ + สีพื้นขอบ ตามตัวโปรแกรม (โหมดมืด) */
            function syncChrome() {
                try {
                    const doc = frame.contentDocument;
                    if (!doc) return;
                    if (doc.title && doc.title !== document.title) document.title = doc.title;
                    const bg = doc.body ? getComputedStyle(doc.body).backgroundColor : "";
                    if (bg && bg !== "rgba(0, 0, 0, 0)" && document.body.style.background !== bg) document.body.style.background = bg;
                } catch (error) { /* ไม่เป็นไร */ }
            }

            frame.addEventListener("load", () => {
                focusApp();
                syncChrome();
            });

            setInterval(syncChrome, 2000);

            /* คลิกที่ขอบ → กลับไปที่ตัวโปรแกรม (ปุ่มลัดใช้ได้ต่อ) */
            document.addEventListener("pointerdown", event => {
                if (event.target !== frame) focusApp();
            });

            /* Ctrl+P ตอนโฟกัสอยู่ที่กรอบ → พิมพ์ A3 ของโปรแกรม */
            window.addEventListener("keydown", event => {
                if ((event.ctrlKey || event.metaKey) && (event.key === "p" || event.key === "P")) {
                    try {
                        const app = frame.contentWindow;
                        if (app.ZGPrintA3 && typeof app.ZGPrintA3.print === "function") {
                            event.preventDefault();
                            app.ZGPrintA3.print();
                        }
                    } catch (error) { /* ไม่เป็นไร */ }
                }
            });
        })();
    </script>
</body>

</html>
