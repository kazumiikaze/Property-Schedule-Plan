<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Schedule Plan</title>

    <!-- ติดตั้งเป็นแอปบนเครื่อง (Edge / Chrome → ติดตั้งแอปนี้) · ไอคอนแท็บ -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2e8b57">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!--
        กรอบขนาดคงที่ — หน้ากระดานเหมือนกันทุกเครื่อง / ทุกขนาดจอ

        ตัวโปรแกรม (app.html) ทำงานในหน้าต่างเสมือน 2557 × 1403 เสมอ (ขนาดหน้าเว็บเต็มจอของเครื่องหลัก — จอ 2560×1440 · 150%)
        → ความสูงหมวด ความกว้างช่องวัน ขนาดตัวอักษร ตำแหน่งทุกชิ้น คำนวณเท่ากันทุกเครื่อง
        แล้วกรอบนี้ย่อ / ขยายทั้งก้อนให้เต็มความกว้างจอจริง (สูงต่างกันนิดหน่อย → ปรับแนวตั้งให้พอดี · ต่างมาก → เลื่อนลงดูได้)
    -->
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: hidden;
            background: #f4f6f5;
        }

        /* จอเตี้ยกว่ากระดานมาก → เลื่อนขึ้นลงดูส่วนล่างได้ */
        html.zg-scroll,
        html.zg-scroll body {
            overflow-y: auto;
        }

        #zgSpacer {
            width: 1px;
            height: 0;
        }

        #zgStage {
            position: absolute;
            left: 0;
            top: 0;
            width: 2557px;
            height: 1403px;
            transform-origin: 0 0;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, .06);
        }

        #zgApp {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #ffffff;
        }

        /* จอกว้างพิเศษ: ปุ่มขยายการแสดงผล (เฉพาะเครื่อง · อยู่ในขอบว่างขวาล่าง · ไม่ยุ่งกับแผน / งานพิมพ์) */
        #zgZoom {
            position: fixed;
            right: 14px;
            bottom: 14px;
            z-index: 10;
            display: none;
            align-items: center;
            gap: 2px;
            padding: 4px;
            border: 1px solid #d6ddd9;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 6px 18px -10px rgba(30, 41, 36, .35);
            font: 12px/1 "Segoe UI", Tahoma, sans-serif;
            color: #26302b;
        }

        html.zg-ultra #zgZoom {
            display: flex;
        }

        #zgZoom span {
            padding: 0 6px;
            color: #66736c;
        }

        #zgZoom b {
            min-width: 44px;
            text-align: center;
        }

        #zgZoom button {
            width: 28px;
            height: 26px;
            border: 0;
            border-radius: 7px;
            background: #eef3f0;
            color: #26302b;
            font: 600 15px/1 "Segoe UI", Tahoma, sans-serif;
            cursor: pointer;
        }

        #zgZoom button:hover {
            background: #dfeae4;
        }

        #zgZoom button:disabled {
            opacity: .4;
            cursor: default;
        }

        /* หน้าแจ้ง: ใช้ได้เฉพาะ Chrome / เปิดในแอป */
        #zgGate {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            place-items: center;
            padding: 24px;
            background: #f4f6f5;
            font: 15px/1.55 "Segoe UI", Tahoma, sans-serif;
            color: #26302b;
        }

        html.zg-gated #zgGate {
            display: grid;
        }

        html.zg-gated #zgStage,
        html.zg-gated #zgZoom {
            display: none !important;
        }

        .zg-gate__card {
            width: min(560px, 100%);
            padding: 32px 32px 26px;
            border: 1px solid #dfe6e2;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 24px 60px -30px rgba(20, 40, 30, .35);
            text-align: center;
        }

        .zg-gate__logo {
            width: 54px;
            height: 54px;
            margin: 0 auto 14px;
            border: 7px solid #7ac143;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .zg-gate__card h1 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .zg-gate__card p {
            margin: 0 0 18px;
            color: #55625b;
        }

        .zg-gate__actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .zg-gate__btn {
            display: block;
            padding: 11px 16px;
            border: 1px solid #cfdcd4;
            border-radius: 10px;
            background: #ffffff;
            color: #26302b;
            font: 600 14px/1.3 "Segoe UI", Tahoma, sans-serif;
            text-decoration: none;
            cursor: pointer;
        }

        .zg-gate__btn--primary {
            border-color: #2e8b57;
            background: #2e8b57;
            color: #ffffff;
        }

        .zg-gate__btn:hover {
            filter: brightness(.96);
        }

        .zg-gate__hint {
            margin: 16px 0 0;
            padding-left: 18px;
            font-size: 12.5px;
            color: #7a867f;
            text-align: left;
        }

        .zg-gate__hint:empty {
            display: none;
        }

        .zg-gate__hint li {
            margin: 3px 0;
        }

        .zg-gate__skip {
            display: inline-block;
            margin-top: 14px;
            font-size: 12px;
            color: #8a978f;
            background: none;
            border: 0;
            text-decoration: underline;
            cursor: pointer;
        }

        @media print {
            #zgStage { position: static; transform: none !important; }
            #zgZoom { display: none !important; }
        }
    </style>
</head>

<body>
    <div id="zgSpacer"></div>
    <div id="zgStage">
        <iframe id="zgApp" title="Property Schedule Plan" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    </div>

    <div id="zgGate" role="dialog" aria-modal="true" aria-labelledby="zgGateTitle">
        <div class="zg-gate__card">
            <div class="zg-gate__logo" aria-hidden="true"></div>
            <h1 id="zgGateTitle"></h1>
            <p id="zgGateText"></p>
            <div class="zg-gate__actions" id="zgGateActions"></div>
            <ul class="zg-gate__hint" id="zgGateHint"></ul>
        </div>
    </div>

    <div id="zgZoom" role="group" aria-label="ขนาดการแสดงผลบนจอนี้">
        <span>ขนาดบนจอ</span>
        <button type="button" data-zoom="-1" aria-label="ย่อ">−</button>
        <b id="zgZoomValue">100%</b>
        <button type="button" data-zoom="1" aria-label="ขยาย">+</button>
    </div>

    <script>
        (function () {

            /* ต้องตรงกับขนาดกรอบใน CSS ด้านบน */
            const W = 2557;
            const H = 1403;

            /* ความสูงต่างจากกรอบไม่เกินเท่านี้ → บีบ/ยืดแนวตั้งนิดเดียวให้เต็มจอพอดี (มองไม่ออก) */
            const FILL_TOLERANCE = 0.06;

            /* จอกว้างพิเศษ (21:9 เช่น 3440×1440) เท่านั้นที่ใช้ "พอดีความสูง วางกลาง" — จอ 16:9 / โน้ตบุ๊ก ทำงานเหมือนเดิม */
            const ULTRAWIDE = 2.2;

            /* จอกว้างพิเศษ: ขยายการแสดงผลได้ (จำไว้ในเครื่อง) · เหลือขอบข้างอย่างน้อยเท่านี้ ให้ปุ่มไม่ทับกระดาน */
            const ZOOM_KEY = "zg-ultrawide-zoom";
            const ZOOM_STEP = 0.1;
            const SIDE_MIN = 230;
            let ultraZoom = 1;
            try { ultraZoom = Math.max(1, Number(localStorage.getItem(ZOOM_KEY)) || 1); } catch (error) { /* ไม่เป็นไร */ }
            let ultraMax = 1;

            const stage = document.getElementById("zgStage");
            const spacer = document.getElementById("zgSpacer");
            const frame = document.getElementById("zgApp");

            /*
                ลิงก์ส่งต่อให้ตัวโปรแกรมครบ (?customer_id=… จาก CRM ฯลฯ)
                เปิดผ่าน "ลิงก์เปิดแอป" (web+zgplan://open?…) → Chrome ส่งมาเป็น ?launch=… → แกะค่าเดิมออกมา
            */
            function appQuery() {
                const params = new URLSearchParams(location.search);
                const launch = params.get("launch");
                if (launch) {
                    const at = launch.indexOf("?");
                    return at >= 0 ? launch.slice(at) : "";
                }
                return location.search;
            }

            /* =====================================================
               ใช้ได้เฉพาะ Google Chrome · เครื่องที่ติดตั้งแอปแล้ว → ใช้แอป
            ===================================================== */

            const isApp = ["standalone", "window-controls-overlay", "minimal-ui", "fullscreen"]
                .some(mode => window.matchMedia && window.matchMedia(`(display-mode: ${mode})`).matches);

            function browserName() {
                const brands = (navigator.userAgentData && navigator.userAgentData.brands || []).map(b => b.brand);
                const ua = navigator.userAgent || "";
                if (brands.includes("Microsoft Edge") || /Edg\//.test(ua)) return "Microsoft Edge";
                if (brands.includes("Opera") || /OPR\//.test(ua)) return "Opera";
                if (brands.includes("Brave") || navigator.brave) return "Brave";
                if (/Firefox\//.test(ua)) return "Firefox";
                if (brands.includes("Google Chrome") || brands.includes("HeadlessChrome")) return "Chrome";
                if (!brands.length && /Chrome\//.test(ua) && !/Edg\/|OPR\/|Vivaldi|YaBrowser|SamsungBrowser/.test(ua)) return "Chrome";
                if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return "Safari";
                return "เบราว์เซอร์นี้";
            }

            function download(name, text) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
                a.download = name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 4000);
            }

            function readKey(key) {
                try { return localStorage.getItem(key); } catch (error) { return null; }
            }

            function showGate({ title, text, actions, hints, skip }) {
                document.getElementById("zgGateTitle").textContent = title;
                document.getElementById("zgGateText").textContent = text;
                const box = document.getElementById("zgGateActions");
                box.innerHTML = "";
                actions.forEach(action => {
                    const el = document.createElement(action.href ? "a" : "button");
                    el.className = "zg-gate__btn" + (action.primary ? " zg-gate__btn--primary" : "");
                    el.textContent = action.label;
                    if (action.href) el.href = action.href;
                    else el.type = "button";
                    if (action.run) el.addEventListener("click", action.run);
                    box.appendChild(el);
                });
                const hint = document.getElementById("zgGateHint");
                hint.innerHTML = "";
                (hints || []).forEach(line => { const li = document.createElement("li"); li.textContent = line; hint.appendChild(li); });
                document.querySelectorAll(".zg-gate__skip").forEach(el => el.remove());
                if (skip) {
                    const b = document.createElement("button");
                    b.type = "button";
                    b.className = "zg-gate__skip";
                    b.textContent = skip.label;
                    b.addEventListener("click", skip.run);
                    hint.after(b);
                }
                document.documentElement.classList.add("zg-gated");
            }

            /* เบราว์เซอร์อื่น: ไม่โหลดโปรแกรม · ให้ดาวน์โหลดแผน/เทมเพลตที่ทำไว้ในเบราว์เซอร์นี้ไปกู้คืนใน Chrome */
            function gateNotChrome(name) {
                const link = location.href;
                const tag = name.replace(/\s+/g, "-");
                const actions = [{
                    label: "คัดลอกลิงก์ไปเปิดใน Chrome",
                    primary: true,
                    run: event => {
                        const done = () => { event.target.textContent = "คัดลอกลิงก์แล้ว — วางในช่องที่อยู่ของ Chrome"; };
                        if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, done); else done();
                    }
                }];
                const plans = readKey("zg-property-schedule-plans-v1");
                if (plans) {
                    actions.push({ label: "ดาวน์โหลดแผนทั้งหมดในเบราว์เซอร์นี้ (.json)", run: () => download(`plans-from-${tag}.json`, plans) });
                }
                const tpls = readKey("zg-property-schedule-templates-v1");
                const hasTpls = Boolean(tpls && tpls !== "[]");
                if (hasTpls) {
                    actions.push({ label: "ดาวน์โหลดเทมเพลตที่บันทึกไว้ (.json)", run: () => {
                        let list = [];
                        try { list = JSON.parse(tpls) || []; } catch (error) { list = []; }
                        download(`templates-from-${tag}.json`, JSON.stringify({ app: "zg-property-schedule-templates", version: 1, exportedAt: new Date().toISOString(), templates: list }, null, 2));
                    } });
                }
                actions.push({ label: "ดาวน์โหลด Google Chrome", href: "https://www.google.com/chrome/" });
                const hints = [];
                if (plans || hasTpls) {
                    hints.push("แผนที่ทำไว้ในเบราว์เซอร์นี้ไม่ย้ายไป Chrome เอง — กดดาวน์โหลดเก็บไว้ก่อน");
                    if (plans) hints.push("ใน Chrome: กดชื่อแผน › ⟲ กู้คืนจากสำรอง › เปิดไฟล์สำรอง (.json) › กู้แผนนี้");
                    if (hasTpls) hints.push("เทมเพลต: ใน Chrome เปิดเมนูเทมเพลต › ⬇ Import เทมเพลต (.json)");
                }
                if (isApp) hints.push("แอปนี้ติดตั้งผ่านเบราว์เซอร์อื่น — ถอนการติดตั้ง แล้วติดตั้งใหม่จาก Chrome");
                showGate({
                    title: "ใช้ได้เฉพาะ Google Chrome",
                    text: `กรุณาเปิด Property Schedule Plan ด้วย Google Chrome (ตอนนี้เปิดด้วย ${name}${isApp ? " แบบแอป" : ""})`,
                    actions,
                    hints
                });
            }

            /* Chrome แบบแท็บ บนเครื่องที่ติดตั้งแอปแล้ว → เปิดในแอป (ค่าจากลิงก์ เช่น CRM ส่งต่อครบ) */
            function gateUseApp() {
                const target = "web+zgplan://open" + appQuery() + location.hash;
                showGate({
                    title: "เครื่องนี้ติดตั้งแอปไว้แล้ว",
                    text: "เปิดใช้งาน Property Schedule Plan จากแอปในเครื่อง",
                    actions: [{ label: "เปิดในแอป", primary: true, href: target }],
                    hints: [
                        "ครั้งแรก Chrome จะถามยืนยันการเปิดแอป — กด เปิด / Open",
                        "หรือเปิดแอปจาก Start menu / ไอคอนบน Desktop ก็ได้",
                        "ปิดแท็บนี้ได้หลังแอปเปิดแล้ว"
                    ],
                    skip: { label: "ใช้ในเบราว์เซอร์ครั้งนี้", run: () => { document.documentElement.classList.remove("zg-gated"); startApp(); } }
                });
            }

            let started = false;
            function startApp() {
                if (started) return;
                started = true;
                frame.src = "app.html" + appQuery() + location.hash;
            }

            (async function gate() {
                const name = browserName();
                if (name !== "Chrome") { gateNotChrome(name); return; }
                if (!isApp && navigator.getInstalledRelatedApps) {
                    try {
                        const apps = await Promise.race([
                            navigator.getInstalledRelatedApps(),
                            new Promise(resolve => setTimeout(() => resolve([]), 1500))
                        ]);
                        if (Array.isArray(apps) && apps.some(app => app && app.platform === "webapp")) { gateUseApp(); return; }
                    } catch (error) { /* ตรวจไม่ได้ → ใช้ต่อในแท็บ */ }
                }
                startApp();
            })();

            /*
                เต็มความกว้างเสมอ (ไม่มีขอบซ้าย-ขวา)
                - สูงไม่พอ/เกินนิดหน่อย → ปรับแนวตั้งให้พอดีจอ
                - จอกว้างพิเศษ (กว้างกว่ากระดานมาก) → พอดีความสูง วางกลางจอ
                - สูงไม่พอมาก (จอแคบ) → คงสัดส่วน เลื่อนลงดูได้ · สูงเกินมาก → คงสัดส่วน เว้นด้านล่าง
            */
            const zoomValue = document.getElementById("zgZoomValue");
            const zoomButtons = document.querySelectorAll("#zgZoom button");

            function fit() {
                const root = document.documentElement;
                let ultra = false;
                const vh = window.innerHeight;
                let vw = window.innerWidth;
                let sx = vw / W;
                let sy = sx;
                const need = H * sx;
                let left = 0;
                if (Math.abs(need - vh) / vh <= FILL_TOLERANCE) {
                    sy = vh / H;
                    root.classList.remove("zg-scroll");
                } else if (need > vh && vw / vh >= ULTRAWIDE) {
                    /* จอกว้างพิเศษ (เช่น 3440×1440) → พอดีความสูง วางกลางจอ เห็นทั้งกระดานไม่ต้องเลื่อน
                       ขยายเพิ่มได้ด้วยปุ่ม "ขนาดบนจอ" (เกินความสูงจอ → เลื่อนลงดูได้) */
                    ultra = true;
                    const base = vh / H;
                    ultraMax = Math.max(1, Math.floor((vw - SIDE_MIN * 2) / (W * base) * 10) / 10);
                    const zoom = Math.min(ultraZoom, ultraMax);
                    sx = sy = base * zoom;
                    if (H * sy > vh + 1) {
                        root.classList.add("zg-scroll");
                        vw = root.clientWidth || vw;
                    } else {
                        root.classList.remove("zg-scroll");
                    }
                    left = Math.round((vw - W * sx) / 2);
                    zoomValue.textContent = `${Math.round(zoom * 100)}%`;
                    zoomButtons[0].disabled = zoom <= 1.001;
                    zoomButtons[1].disabled = zoom >= ultraMax - 0.001;
                } else if (need > vh) {
                    root.classList.add("zg-scroll");
                    vw = root.clientWidth || vw;          // มีแถบเลื่อน → กว้างลดลง
                    sx = sy = vw / W;
                } else {
                    root.classList.remove("zg-scroll");
                }
                sx = Math.max(0.1, sx);
                sy = Math.max(0.1, sy);
                stage.style.transform = `translate(${left}px, 0) scale(${sx}, ${sy})`;
                spacer.style.height = root.classList.contains("zg-scroll") ? `${Math.ceil(H * sy)}px` : "0px";
                root.classList.toggle("zg-ultra", ultra);
            }

            document.getElementById("zgZoom").addEventListener("click", event => {
                const button = event.target.closest("[data-zoom]");
                if (!button) return;
                const next = Math.round((Math.min(ultraZoom, ultraMax) + Number(button.dataset.zoom) * ZOOM_STEP) * 100) / 100;
                ultraZoom = Math.max(1, Math.min(ultraMax, next));
                try { localStorage.setItem(ZOOM_KEY, String(ultraZoom)); } catch (error) { /* ไม่เป็นไร */ }
                fit();
                focusApp();
            });

            fit();
            window.addEventListener("resize", fit);

            function focusApp() {
                try { frame.contentWindow.focus(); } catch (error) { /* ไม่เป็นไร */ }
            }

            /* ชื่อแท็บ + สีพื้นขอบ ตามตัวโปรแกรม (โหมดมืด) */
            function syncChrome() {
                try {
                    const doc = frame.contentDocument;
                    if (!doc) return;
                    if (doc.title && doc.title !== document.title) document.title = doc.title;
                    const bg = doc.body ? getComputedStyle(doc.body).backgroundColor : "";
                    if (bg && bg !== "rgba(0, 0, 0, 0)" && document.body.style.background !== bg) document.body.style.background = bg;
                } catch (error) { /* ไม่เป็นไร */ }
            }

            frame.addEventListener("load", () => {
                focusApp();
                syncChrome();
            });

            setInterval(syncChrome, 2000);

            /* คลิกที่ขอบ → กลับไปที่ตัวโปรแกรม (ปุ่มลัดใช้ได้ต่อ) */
            document.addEventListener("pointerdown", event => {
                if (event.target !== frame) focusApp();
            });

            /* Ctrl+P ตอนโฟกัสอยู่ที่กรอบ → พิมพ์ A3 ของโปรแกรม */
            window.addEventListener("keydown", event => {
                if ((event.ctrlKey || event.metaKey) && (event.key === "p" || event.key === "P")) {
                    try {
                        const app = frame.contentWindow;
                        if (app.ZGPrintA3 && typeof app.ZGPrintA3.print === "function") {
                            event.preventDefault();
                            app.ZGPrintA3.print();
                        }
                    } catch (error) { /* ไม่เป็นไร */ }
                }
            });
        })();
    </script>
</body>

</html>
